<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Family Quest: Spy Agency</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<style>
  :root { --dark:#1E1A16; --accent:#B4623F; --gold:#C9A05C; --ui-bg:rgba(30,26,22,0.85); }
  body { 
    margin:0; padding:0; background:#000; color:#fff; font-family:'Inter', sans-serif;
    overflow: hidden; touch-action: none;
  }
  .hidden { display: none !important; }
  
  /* Landscape Enforcer */
  #landscape-warning { display: none; position: absolute; z-index: 9999; width: 100vw; height: 100vh; background: var(--dark); flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
  @media screen and (orientation: portrait) {
    #landscape-warning { display: flex; }
  }

  /* UI Screens */
  .screen { position: absolute; top:0; left:0; width:100vw; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--dark); z-index: 1000; }
  .card { background:#2A241E; padding:20px; border-radius:15px; text-align:center; max-width:400px; width:90%; border:1px solid var(--gold); }
  input { width:90%; padding:12px; margin:10px 0; border-radius:8px; border:none; background:#111; color:#fff; font-size:16px; text-align:center; }
  button { width:100%; padding:14px; margin-top:10px; border-radius:8px; font-weight:bold; cursor:pointer; background:var(--accent); color:#fff; border:none; font-size:16px; }
  
  /* 2.5D Game Engine */
  #game-viewport { position: absolute; top:0; left:0; width:100vw; height:100vh; overflow:hidden; }
  
  /* Public Domain RPG Map Injection */
  #game-world { 
    position: absolute; top:0; left:0; width: 2000px; height: 1500px; 
    background: url('https://upload.wikimedia.org/wikipedia/commons/3/30/2D_RPG_Map_Example.png') center/cover; 
    background-color: #5C7A5C;
    will-change: transform; transform-origin: top left;
  }
  
  .player-avatar { 
    position: absolute; width: 70px; height: 70px; border-radius: 50%; 
    border: 3px solid var(--gold); object-fit: cover; 
    box-shadow: 0 10px 15px rgba(0,0,0,0.6);
    will-change: transform; transform-origin: bottom center;
  }
  .player-name {
    position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8); padding: 3px 8px; border-radius: 10px;
    font-size: 11px; white-space: nowrap; font-weight: bold;
  }
  .interactable {
    position: absolute; width: 60px; height: 60px; background: var(--dark);
    border-radius: 10px; border: 2px solid var(--gold);
    display:flex; align-items:center; justify-content:center; font-size:24px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  /* Controls */
  .controls { position: absolute; z-index: 500; }
  #d-pad { bottom: 20px; left: 20px; display: grid; grid-template-columns: 55px 55px 55px; gap: 5px; }
  .d-btn { height: 55px; background: var(--ui-bg); border: 2px solid var(--gold); border-radius: 10px; color: #fff; font-size: 20px; display:flex; align-items:center; justify-content:center; user-select:none; }
  .d-btn:active { background: var(--gold); color: #000; }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  #down { grid-column: 2; grid-row: 3; }

  #action-btn { position: absolute; bottom: 35px; right: 20px; width: 75px; height: 75px; border-radius: 50%; background: var(--ui-bg); border: 3px solid var(--accent); color: #fff; font-weight: bold; font-size: 13px; user-select:none; }
  #action-btn:active { background: var(--accent); transform:scale(0.95); }
  
  #notification { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: var(--accent); padding: 10px 20px; border-radius: 20px; z-index: 600; transition: opacity 0.3s; font-weight:bold; }
</style>
</head>
<body>

  <div id="landscape-warning">
    <h2>Rotate Device</h2>
    <p>This operation requires landscape orientation.</p>
  </div>
    <div id="screen-setup" class="screen">
    <div class="card">
      <h1 style="color:var(--accent); margin:0 0 5px 0;">Family Quest</h1>
      <input type="text" id="player-name" placeholder="Agent Name" onkeyup="checkIdentity()">
      
      <div id="photo-upload-section" style="margin:15px 0; padding:15px; border:1px dashed var(--gold); border-radius:8px;">
        <label style="display:block; margin-bottom:10px; font-size:14px;">Upload ID Photo</label>
        <input type="file" accept="image/*" id="photo-input" onchange="handlePhoto(event)">
        <canvas id="avatar-canvas" class="hidden" width="100" height="100" style="margin-top:10px; border-radius:50%; border:2px solid #fff;"></canvas>
      </div>
      
      <button onclick="enterLobby()">Initialize Profile</button>
    </div>
  </div>

  <div id="screen-lobby" class="screen hidden">
    <div class="card">
      <h2>Mission Lobby</h2>
      <button onclick="hostGame()">Host New Operation</button>
      <input type="text" id="join-code" placeholder="Enter Op Code" style="text-transform:uppercase; letter-spacing:2px; margin-top:20px;">
      <button onclick="joinGame()" style="background:transparent; border:2px solid var(--accent); color:var(--accent);">Join Operation</button>
    </div>
  </div>

  <div id="screen-waiting" class="screen hidden">
    <div class="card">
      <h2>Op Code: <span id="display-code" style="color:var(--gold);"></span></h2>
      <ul id="players-list" style="list-style:none; padding:0; text-align:left;"></ul>
      <button id="start-btn" class="hidden" onclick="startGame()">Deploy Agents</button>
    </div>
  </div>

  <div id="screen-game" class="hidden">
    <div id="game-viewport">
      <div id="game-world">
        <!-- Interactable Puzzle Item -->
        <div class="interactable" id="vault-1" style="left: 1000px; top: 750px;">🔒</div>
      </div>
    </div>
    
    <div id="notification" class="hidden"></div>
    
    <div id="d-pad" class="controls">
      <!-- Added event.preventDefault() to stop mobile double-firing -->
      <div class="d-btn" id="up" ontouchstart="startMove(event, 'up')" onmousedown="startMove(event, 'up')" onmouseup="stopMove(event)" ontouchend="stopMove(event)" onmouseleave="stopMove(event)">▲</div>
      <div class="d-btn" id="left" ontouchstart="startMove(event, 'left')" onmousedown="startMove(event, 'left')" onmouseup="stopMove(event)" ontouchend="stopMove(event)" onmouseleave="stopMove(event)">◀</div>
      <div class="d-btn" id="right" ontouchstart="startMove(event, 'right')" onmousedown="startMove(event, 'right')" onmouseup="stopMove(event)" ontouchend="stopMove(event)" onmouseleave="stopMove(event)">▶</div>
      <div class="d-btn" id="down" ontouchstart="startMove(event, 'down')" onmousedown="startMove(event, 'down')" onmouseup="stopMove(event)" ontouchend="stopMove(event)" onmouseleave="stopMove(event)">▼</div>
    </div>
    <button id="action-btn" onclick="interact()">INTERACT</button>
  </div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
  const firebaseConfig = {
    apiKey: "AIzaSyBAvhilaqL4R9aTg_1yIJJGTLUablzA-38",
    authDomain: "family-game-4646b.firebaseapp.com",
    projectId: "family-game-4646b",
    storageBucket: "family-game-4646b.firebasestorage.app",
    messagingSenderId: "404759157112",
    appId: "1:404759157112:web:66d4d49d728849ca92d08d"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let myName = "";
  let myAvatar = null;
  let currentRoom = null;
  let isHost = false;

  function checkIdentity() {
    const val = document.getElementById('player-name').value.trim().toLowerCase();
    const uploadUI = document.getElementById('photo-upload-section');
    if (val === 'husain') {
      uploadUI.style.display = 'none';
      myAvatar = 'husain.png'; // Pointing to your specific GitHub upload
    } else {
      uploadUI.style.display = 'block';
    }
  }

  function handlePhoto(event) {
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.getElementById('avatar-canvas');
        const ctx = canvas.getContext('2d');
        const size = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - size)/2, (img.height - size)/2, size, size, 0, 0, 100, 100);
        canvas.classList.remove('hidden');
        myAvatar = canvas.toDataURL('image/jpeg', 0.6);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function enterLobby() {
    myName = document.getElementById('player-name').value.trim() || "Agent";
    document.getElementById('screen-setup').classList.add('hidden');
    document.getElementById('screen-lobby').classList.remove('hidden');
  }

  async function hostGame() {
    isHost = true;
    currentRoom = Math.random().toString(36).substring(2, 6).toUpperCase();
    await db.collection('rooms').doc(currentRoom).set({ status: 'lobby', vaultOpen: false });
    setupRoom(currentRoom);
  }

  async function joinGame() {
    const code = document.getElementById('join-code').value.trim().toUpperCase();
    const doc = await db.collection('rooms').doc(code).get();
    if(doc.exists) { currentRoom = code; setupRoom(code); } else { alert("Invalid Op Code"); }
  }

  function setupRoom(code) {
    document.getElementById('screen-lobby').classList.add('hidden');
    document.getElementById('screen-waiting').classList.remove('hidden');
    document.getElementById('display-code').textContent = code;
    if (isHost) document.getElementById('start-btn').classList.remove('hidden');

    db.collection('rooms').doc(code).collection('players').onSnapshot(snap => {
      const list = document.getElementById('players-list');
      list.innerHTML = "";
      snap.forEach(doc => {
        const p = doc.data();
        list.innerHTML += `<li style="margin-bottom:10px; font-weight:bold;">🟢 ${p.name}</li>`;
        if (!document.getElementById('screen-game').classList.contains('hidden')) {
          updatePlayerElement(p);
        }
      });
    });

    db.collection('rooms').doc(code).onSnapshot(snap => {
      const data = snap.data();
      if(data && data.status === 'playing') {
        document.getElementById('screen-waiting').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
        initGameEngine();
      }
      if(data && data.vaultOpen) {
        document.getElementById('vault-1').innerHTML = "🔓";
        document.getElementById('vault-1').style.background = "var(--sage)";
      }
    });
  }

  async function startGame() {
    await db.collection('rooms').doc(currentRoom).update({ status: 'playing' });
  }
      // --- Smooth Physics Engine ---
  let myX = 800; // Map spawn coordinates
  let myY = 600;
  let moveDir = null;
  const SPEED = 4; // Drastically reduced for smooth control

  function notify(text) {
    const el = document.getElementById('notification');
    el.textContent = text;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 2500);
  }

  function initGameEngine() {
    db.collection('rooms').doc(currentRoom).collection('players').doc(myName).set({
      name: myName, avatar: myAvatar, x: myX, y: myY
    });
    requestAnimationFrame(gameLoop);
  }

  function updatePlayerElement(p) {
    let el = document.getElementById('player-' + p.name);
    if (!el) {
      el = document.createElement('div');
      el.id = 'player-' + p.name;
      el.innerHTML = `
        <img class="player-avatar" src="${p.avatar || 'husain.png'}" alt="${p.name}">
        <div class="player-name">${p.name}</div>
      `;
      document.getElementById('game-world').appendChild(el);
    }
    
    // 2.5D Scaling Illusion
    const scale = 0.6 + (p.y / 1500) * 0.6; 
    
    const avatarImg = el.querySelector('.player-avatar');
    avatarImg.style.transform = `translate(${p.x}px, ${p.y}px) scale(${scale})`;
    avatarImg.style.zIndex = Math.floor(p.y);
    el.querySelector('.player-name').style.transform = `translate(calc(${p.x}px - 50% + 35px), ${p.y + 75 * scale}px)`;
  }

  // Joystick Controls with strict event overriding
  function startMove(e, dir) { 
    e.preventDefault(); // Prevents ghost clicks
    moveDir = dir; 
  }
  function stopMove(e) { 
    e.preventDefault(); 
    moveDir = null; 
    // Final sync on stop to ensure exact position saves
    if(currentRoom) db.collection('rooms').doc(currentRoom).collection('players').doc(myName).update({ x: myX, y: myY });
  }

  // Frame execution loop
  let frameCount = 0;
  function gameLoop() {
    let moved = false;
    if(moveDir === 'up') { myY -= SPEED; moved = true; }
    if(moveDir === 'down') { myY += SPEED; moved = true; }
    if(moveDir === 'left') { myX -= SPEED; moved = true; }
    if(moveDir === 'right') { myX += SPEED; moved = true; }

    // Map limits
    myX = Math.max(0, Math.min(myX, 1900));
    myY = Math.max(0, Math.min(myY, 1400));

    // Throttle network sync to prevent database overload (updates every 5th frame)
    if (moved) {
      frameCount++;
      if (frameCount % 5 === 0) {
        db.collection('rooms').doc(currentRoom).collection('players').doc(myName).update({ x: myX, y: myY });
      }
    }

    // Centered Camera Math
    const world = document.getElementById('game-world');
    const camX = -myX + (window.innerWidth / 2) - 35;
    const camY = -myY + (window.innerHeight / 2) - 35;
    world.style.transform = `translate(${camX}px, ${camY}px)`;

    requestAnimationFrame(gameLoop);
  }

  // Generous Interaction Radius
  function interact() {
    // The vault is at X: 1000, Y: 750. 
    // Increased hit detection radius to 200 for easier alignment
    const dist = Math.hypot(myX - 1000, myY - 750);
    if (dist < 200) {
      db.collection('rooms').doc(currentRoom).update({ vaultOpen: true });
      notify("Access Granted. Secret Unlocked!");
    } else {
      notify("Move closer to an object to interact.");
    }
  }
</script>
</body>
</html>
