<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Test</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#1a1a1a;height:100%;}
  #status{
    position:fixed; top:0; left:0; right:0; z-index:10;
    background:rgba(0,0,0,0.75); color:#7CFC98;
    font-family:monospace; font-size:13px; padding:10px 12px;
    white-space:pre-wrap; word-break:break-word;
  }
  #status.error{ color:#FF6B6B; }
  canvas{ display:block; }
  #controls{
    position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); left:0; right:0;
    display:grid; grid-template-columns:60px 60px 60px; grid-template-rows:60px 60px;
    gap:10px; justify-content:center; z-index:10;
  }
  .ctrl-btn{
    width:60px; height:60px; border-radius:14px; border:none;
    background:rgba(255,255,255,0.18); color:#fff; font-size:24px;
    -webkit-tap-highlight-color:transparent; touch-action:none; user-select:none;
  }
  .ctrl-btn:active{ background:rgba(255,255,255,0.35); }
  #btn-left{ grid-column:1; grid-row:2; }
  #btn-forward{ grid-column:2; grid-row:1; }
  #btn-back{ grid-column:2; grid-row:2; }
  #btn-right{ grid-column:3; grid-row:2; }
</style>
</head>
<body>
<div id="status">Starting…</div>
<div id="controls">
  <button id="btn-left" class="ctrl-btn">◀</button>
  <button id="btn-forward" class="ctrl-btn">▲</button>
  <button id="btn-back" class="ctrl-btn">▼</button>
  <button id="btn-right" class="ctrl-btn">▶</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  const statusEl = document.getElementById('status');
  function setStatus(msg, isError){
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', !!isError);
  }
  window.addEventListener('error', (e) => {
    setStatus('Script error: ' + e.message, true);
  });

  try {
    const THREE = await import('three');
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');

    setStatus('Three.js loaded. Setting up scene…');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2420);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 2);
    dir.position.set(3,5,3);
    scene.add(dir);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30,30),
      new THREE.MeshStandardMaterial({ color: 0x5C7A5C })
    );
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    let mixer, model, idleAction, walkAction, currentAction;
    const clock = new THREE.Clock();

    // ---- touch controls ----
    const input = { forward:false, back:false, left:false, right:false };
    function bind(id, key){
      const el = document.getElementById(id);
      const on = (e) => { e.preventDefault(); input[key] = true; };
      const off = (e) => { e.preventDefault(); input[key] = false; };
      el.addEventListener('pointerdown', on);
      el.addEventListener('pointerup', off);
      el.addEventListener('pointercancel', off);
      el.addEventListener('pointerleave', off);
    }
    bind('btn-forward','forward');
    bind('btn-back','back');
    bind('btn-left','left');
    bind('btn-right','right');

    // failsafe: force-release every button if a touch ends anywhere,
    // in case a browser fails to fire pointerup on the exact button
    function releaseAll(){ input.forward=input.back=input.left=input.right=false; }
    window.addEventListener('pointerup', releaseAll);
    window.addEventListener('pointercancel', releaseAll);

    setStatus('Loading 3D character…');
    const loader = new GLTFLoader();
    loader.load(
      'https://threejs.org/examples/models/gltf/Soldier.glb',
      (gltf) => {
        model = gltf.scene;
        scene.add(model);
        mixer = new THREE.AnimationMixer(model);
        idleAction = mixer.clipAction(gltf.animations.find(a => /idle/i.test(a.name)) || gltf.animations[0]);
        walkAction = mixer.clipAction(gltf.animations.find(a => /walk/i.test(a.name)) || gltf.animations[0]);
        currentAction = idleAction;
        idleAction.play();
        setStatus('Model loaded ✓ — use the buttons to move');
      },
      undefined,
      (err) => { setStatus('Model failed to load: ' + (err.message || err), true); }
    );

    const turnSpeed = 2.2;   // radians/sec
    const moveSpeed = 2.5;   // units/sec
    const camDistance = 4, camHeight = 2.4;

    function animate(){
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if(model){
        if(input.left)  model.rotation.y += turnSpeed*dt;
        if(input.right) model.rotation.y -= turnSpeed*dt;

        const moving = input.forward || input.back;
        if(input.forward){
          model.position.x -= Math.sin(model.rotation.y)*moveSpeed*dt;
          model.position.z -= Math.cos(model.rotation.y)*moveSpeed*dt;
        }
        if(input.back){
          model.position.x += Math.sin(model.rotation.y)*moveSpeed*dt*0.6;
          model.position.z += Math.cos(model.rotation.y)*moveSpeed*dt*0.6;
        }

        const wantAction = moving ? walkAction : idleAction;
        if(wantAction && wantAction !== currentAction){
          currentAction.fadeOut(0.15);
          wantAction.reset().fadeIn(0.15).play();
          currentAction = wantAction;
        }

        const offsetX = Math.sin(model.rotation.y)*camDistance;
        const offsetZ = Math.cos(model.rotation.y)*camDistance;
        const desired = new THREE.Vector3(model.position.x+offsetX, model.position.y+camHeight, model.position.z+offsetZ);
        camera.position.lerp(desired, 0.12);
        camera.lookAt(model.position.x, model.position.y+1, model.position.z);
      }

      if(mixer) mixer.update(dt);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

  } catch (err) {
    setStatus('Setup failed: ' + err.message, true);
  }
</script>
</body>
</html>
